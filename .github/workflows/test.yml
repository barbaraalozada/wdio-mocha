name: WebDriverIO Tests

permissions:
  contents: write

on:
  workflow_dispatch:
    inputs:
      test_suite:
        description: 'Test suite to run'
        required: true
        default: 'all'
        type: choice
        options:
          - all
          - login
          - checkboxes
          - add:remove:elements
      headless:
        description: 'Run in headless mode'
        required: false
        type: boolean
        default: true

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run tests
        env:
          CI: true
          HEADLESS: ${{ inputs.headless }}
          BASE_URL: ${{ secrets.BASE_URL }}
          LOGIN_USERNAME: ${{ secrets.LOGIN_USERNAME }}
          LOGIN_PASSWORD: ${{ secrets.LOGIN_PASSWORD }}
          DEFAULT_TIMEOUT: ${{ secrets.DEFAULT_TIMEOUT }}
        run: |
          set -e

          echo "Running suite: ${{ inputs.test_suite }}"
          echo "Headless mode: ${{ inputs.headless }}"

          if [ "${{ inputs.test_suite }}" = "all" ]; then
            npm run all
          else
            npm run "${{ inputs.test_suite }}"
          fi

      - name: Upload Allure results
        if: always() && hashFiles('allure-results/**') != ''
        uses: actions/upload-artifact@v4
        with:
          name: allure-results
          path: allure-results/
          retention-days: 7

      - name: Generate Allure report
        if: always() && hashFiles('allure-results/**') != ''
        run: npm run allure:generate

      - name: Upload Allure report
        if: always() && hashFiles('allure-report/**') != ''
        uses: actions/upload-artifact@v4
        with:
          name: allure-report
          path: allure-report/
          retention-days: 7

      - name: Deploy Allure report to GitHub Pages
        if: always() && hashFiles('allure-report/**') != ''
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: allure-report
