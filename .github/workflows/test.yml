name: WebDriverIO Tests

on:
  workflow_dispatch:
    inputs:
      test_suite:
        description: 'Test suite to run'
        required: true
        default: 'all'
        type: choice
        options:
          - all
          - login
          - checkboxes
          - add:remove:elements
      headless:
        description: 'Run in headless mode'
        required: false
        type: boolean
        default: true

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run tests
        env:
          BASE_URL: ${{ secrets.BASE_URL }}
          LOGIN_USERNAME: ${{ secrets.LOGIN_USERNAME }}
          LOGIN_PASSWORD: ${{ secrets.LOGIN_PASSWORD }}
          DEFAULT_TIMEOUT: ${{ secrets.DEFAULT_TIMEOUT }}
        run: |
          if [ "${{ inputs.headless }}" = "true" ] && [ "${{ inputs.test_suite }}" = "all" ]; then
            npm run all:headless
          else
            npm run ${{ inputs.test_suite }}
          fi

      - name: Upload Allure results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: allure-results
          path: allure-results/
          retention-days: 7

      - name: Generate Allure report
        if: always()
        run: npm run allure:generate

      - name: Upload Allure report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: allure-report
          path: allure-report/
          retention-days: 7
