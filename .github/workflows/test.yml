name: WebDriverIO Tests

on:
  workflow_dispatch:
    inputs:
      test_suite:
        description: 'Test suite to run'
        required: true
        default: 'all'
        type: choice
        options:
          - all
          - login
          - checkboxes
          - add:remove:elements
      headless:
        description: 'Run in headless mode'
        required: false
        type: boolean
        default: true

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install Chrome dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libnss3 \
            libatk1.0-0 \
            libatk-bridge2.0-0 \
            libcups2 \
            libdrm2 \
            libxkbcommon0 \
            libxcomposite1 \
            libxdamage1 \
            libxfixes3 \
            libxrandr2 \
            libgbm1 \
            libasound2

      - name: Install dependencies
        run: npm ci

      - name: Verify Chrome installation
        run: |
          google-chrome --version
          which google-chrome

      - name: Setup Xvfb for non-headless mode
        if: ${{ inputs.headless == false }}
        run: |
          sudo apt-get update
          sudo apt-get install -y xvfb

      - name: Run tests
        env:
          CI: true
          BASE_URL: ${{ secrets.BASE_URL }}
          LOGIN_USERNAME: ${{ secrets.LOGIN_USERNAME }}
          LOGIN_PASSWORD: ${{ secrets.LOGIN_PASSWORD }}
          DEFAULT_TIMEOUT: ${{ secrets.DEFAULT_TIMEOUT }}
          DISPLAY: :99
        run: |
          if [ "${{ inputs.headless }}" = "false" ]; then
            # Start Xvfb for non-headless mode
            Xvfb :99 -screen 0 1920x1080x24 &
            sleep 3
          fi

          if [ "${{ inputs.headless }}" = "true" ] && [ "${{ inputs.test_suite }}" = "all" ]; then
            npm run all:headless
          else
            npm run ${{ inputs.test_suite }}
          fi

      - name: Upload Allure results
        if: always() && hashFiles('allure-results/**') != ''
        uses: actions/upload-artifact@v4
        with:
          name: allure-results
          path: allure-results/
          retention-days: 7

      - name: Generate Allure report
        if: always() && hashFiles('allure-results/**') != ''
        run: npm run allure:generate

      - name: Upload Allure report
        if: always() && hashFiles('allure-report/**') != ''
        uses: actions/upload-artifact@v4
        with:
          name: allure-report
          path: allure-report/
          retention-days: 7
